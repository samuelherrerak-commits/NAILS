# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mariana-nails
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://script.google.com/macros/s/AKfycbx70XC3Lb0fhRVf_MMRN0598U-iuyCCGy_jrkeBvwhqXrjD7-qhjBUHBHVEyiNWsAWxeQ/exec
      - key: VITE_API_TOKEN
        value: MARIANAILS
      - key: VITE_WHATSAPP
        value: "584122516390"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
